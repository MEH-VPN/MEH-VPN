name: Build & Verify Android APK

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"

      # Restore persistent keystore from GitHub Secrets (DEBUG_KEYSTORE_BASE64)
      # or committed debug.keystore.base64 so APK upgrades across versions keep
      # the exact same signing certificate and never fail with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
      - name: Restore persistent signing keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "$SECRET_KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\n\r ' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Package named release artifacts
        run: |
          mkdir -p dist
          VERSION="${{ github.ref_name }}"
          [ -z "$VERSION" ] && VERSION="v1.0.0"
          SRC_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$SRC_APK" "dist/MEH-VPN-${VERSION}.apk"
          cp "$SRC_APK" "dist/MEH-VPN-latest.apk"
          echo "Packaged artifacts:"
          ls -l dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEH-VPN-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MEH ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*.apk
